[project]
name = "mufradat-bot"
version = "0.1.0"
description = "Telegram Mini App for learning Arabic vocabulary"
requires-python = ">=3.12,<3.13"
# Общее у обоих контейнеров — только чтение .env.
dependencies = [
    "python-dotenv>=1.2,<2",
]

# Замок и версии одни на весь проект, а ставит каждый контейнер свою группу:
# `uv sync --group backend` и `uv sync --group bot`. Так у бота не окажется Django,
# а у бэкенда — aiogram.
[dependency-groups]
backend = [
    "django>=6.0,<6.1",
    "djangorestframework>=3.17,<4",
    "psycopg[binary]>=3.3,<3.4",
    "pillow>=12.3,<13",
    "gunicorn>=23,<24",
    # Арабская вязь для карточки-картинки: Pillow в контейнере собран без raqm и
    # соединять буквы сам не умеет.
    "arabic-reshaper>=3.0,<4",
    "python-bidi>=0.6,<0.7",
]
bot = [
    "aiogram>=3.30,<4",
    "httpx>=0.28,<0.29",
]
dev = [
    "ruff>=0.16,<0.17",
    "pytest>=9,<10",
    "pytest-django>=4.13,<5",
]

# Проект не библиотека: колесо собирать не нужно, uv ставит только зависимости.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]
# ruff format also reformats python blocks inside markdown, which mangles the
# deliberate fragments in the plans (a bare "app-name," line became a tuple).
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django migrations are generated code.
"*/migrations/*" = ["E501"]

# Тесты бэкенда. База нужна живая: `docker compose up -d db`, адрес берётся из .env.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "bot/tests"]
python_files = ["test_*.py"]
addopts = "-q"
