<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>مفردات</title>

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <!-- Цвет обвязки браузера под фон приложения: --ground из палитры. -->
        <meta name="theme-color" content="#d7dce4" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1d222a" media="(prefers-color-scheme: dark)" />

        <script>
            // Оформление ставится до первой отрисовки, иначе тёмное моргает светлым при
            // каждом запуске. Ключ продублирован из utils/storage.ts: приложения здесь
            // ещё нет, импортировать нечего — меняешь там, правь и тут.
            (function () {
                var appearance = 'light';

                try {
                    if (localStorage.getItem('mufradat.appearance') === 'dark') {
                        appearance = 'dark';
                    }
                } catch (error) {
                    // Приватный режим: остаётся светлое.
                }

                document.documentElement.dataset.theme = appearance;
            })();
        </script>

        <!-- defer, а не блокирующая загрузка: иначе первая отрисовка ждёт стороннего
             домена. Приложение — тоже модуль, то есть отложенное, а отложенные скрипты
             выполняются в порядке разметки, поэтому window.Telegram к его запуску готов. -->
        <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
