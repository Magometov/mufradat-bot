services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mufradat-backend
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
    volumes:
      - media:/app/media
      - static:/app/static
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mufradat-backend
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
    command: ["python", "manage.py", "runbot"]
    # Часть адресов api.telegram.org недоступна с российского хостинга: DNS отдаёт
    # 149.154.166.110, и соединение с ним не устанавливается. Адрес ниже — тот же API,
    # он отвечает. Если однажды перестанет, рабочий ищется перебором:
    # for ip in 149.154.167.220 149.154.175.50 149.154.171.5 91.108.56.130; do
    #     timeout 3 bash -c "</dev/tcp/$ip/443" && echo "$ip ок" || echo "$ip нет"; done
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  caddy:
    build: ./frontend
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      # Пусто или отсутствует — значит работаем как обычно: подстановка ниже не даёт
      # Caddy споткнуться на несуществующем имени сниппета.
      MAINTENANCE: ${MAINTENANCE:-false}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  static:
  caddy-data:
  caddy-config:
