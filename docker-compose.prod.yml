services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mufradat-backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BOT_API_TOKEN: ${BOT_API_TOKEN}
    volumes:
      - media:/app/media
      - static:/app/static
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: mufradat-bot
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      WEBAPP_URL: ${WEBAPP_URL}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      FAL_KEY: ${FAL_KEY}
    volumes:
      - ./flags:/flags:ro
    # Часть адресов api.telegram.org недоступна с российского хостинга: DNS отдаёт
    # 149.154.166.110, и соединение с ним не устанавливается. Адрес ниже — тот же API,
    # он отвечает. Если однажды перестанет, рабочий ищется перебором:
    # for ip in 149.154.167.220 149.154.175.50 149.154.171.5 91.108.56.130; do
    #     timeout 3 bash -c "</dev/tcp/$ip/443" && echo "$ip ок" || echo "$ip нет"; done
    extra_hosts:
      - "api.telegram.org:149.154.167.220"

  caddy:
    build: ./frontend
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Признак техработ: Caddy и бот только читают, ставит и снимает его make.
      - ./flags:/flags:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  static:
  caddy-data:
  caddy-config:
